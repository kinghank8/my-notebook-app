name: Build Android APK From Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачивание архива из репозитория
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Рапасковка вашего ZIP-архива и автоматическое исправление версий Java
    - name: Unzip project files
      run: |
        unzip MyNotebook-Android-Project.zip
        cp -r MyNotebook/* . || true
        # Принудительно выставляем совместимость с Java 17 в файлах build.gradle
        find . -name "build.gradle*" -exec sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' {} +
        find . -name "build.gradle*" -exec sed -i 's/"1.8"/"17"/g' {} +

    # 3. Установка Java 17
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 4. Запуск сборки APK-файла
    - name: Build Debug APK
      run: |
        if [ -f ./gradlew ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "Gradlew not found, trying global gradle"
          gradle assembleDebug
        fi

    # 5. Сохранение готового APK
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
