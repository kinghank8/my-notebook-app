name: Build Android APK From Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачивание архива из репозитория
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Распаковка вашего ZIP-архива прямо на сервере
    - name: Unzip project files
      run: |
        unzip MyNotebook-Android-Project.zip
        # Переносим содержимое распакованной папки в корень для сборщика
        cp -r MyNotebook/* . || true

    # 3. Установка Java
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 4. Запуск сборки APK-файла
    - name: Build Debug APK
      run: |
        if [ -f ./gradlew ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "Gradlew not found, trying global gradle"
          gradle assembleDebug
        fi

    # 5. Сохранение готового APK
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
